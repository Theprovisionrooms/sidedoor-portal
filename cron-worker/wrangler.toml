# Tiny scheduled worker that pokes the app once a day.
# Deploy once with: npx.cmd wrangler deploy --config cron-worker/wrangler.toml
# Then: npx.cmd wrangler secret put CRON_SECRET --config cron-worker/wrangler.toml
name = "sidedoor-portal-cron"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
APP_URL = "https://app.getsidedoor.co.uk"

[triggers]
crons = ["7 8 * * *"]   # 08:07 UTC every day
